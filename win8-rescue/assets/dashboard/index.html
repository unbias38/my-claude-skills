<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電腦監視器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#08161F; --panel:#0E2330; --panel2:#112B3A; --line:#1E3E4E;
  --ink:#E4F3F0; --dim:#7FA2A8; --faint:#4C6E78;
  --cpu:#39F28C; --ram:#3CD3F2; --disk:#FFC845; --temp:#FF5FA2; --batt:#A98BFF; --alarm:#FF4D4D;
  --f-num:"Oxanium","Segoe UI",sans-serif;
  --f-body:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  --f-mono:"JetBrains Mono",Consolas,"Microsoft JhengHei",monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);
  background-image:radial-gradient(1200px 600px at 15% -10%,#0F3140 0%,transparent 60%),
  linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:auto,24px 24px,24px 24px}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;padding:18px 22px;gap:16px}

/* 腕帶 */
.band{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:12px 18px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.host{font:800 34px/1 var(--f-num);letter-spacing:.06em}
.meta{color:var(--dim);font-size:13px;line-height:1.4}
.meta b{color:var(--ink);font-weight:500}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:9px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--dim)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--faint)}
.pill.live{color:var(--cpu);border-color:rgba(57,242,140,.45);background:rgba(57,242,140,.08)}
.pill.live .dot{background:var(--cpu);animation:beat 1.4s infinite}
.pill.off{color:var(--alarm);border-color:rgba(255,77,77,.45)}
.pill.off .dot{background:var(--alarm)}
.clock{font:600 26px/1 var(--f-num);color:var(--dim);font-variant-numeric:tabular-nums}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(57,242,140,.7)}70%{box-shadow:0 0 0 12px rgba(57,242,140,0)}100%{box-shadow:0 0 0 0 rgba(57,242,140,0)}}

.main{display:grid;grid-template-columns:minmax(380px,5fr) 6fr;gap:16px;min-height:0}
.col{display:flex;flex-direction:column;gap:14px;min-height:0}

/* 生命徵象 */
.trace{border:1px solid var(--line);border-radius:14px;background:#06121A;padding:12px 16px 10px;overflow:hidden}
.trace header{display:flex;align-items:baseline;justify-content:space-between}
.label{font-size:13px;color:var(--dim);letter-spacing:.04em}
.big{font:800 46px/1 var(--f-num);font-variant-numeric:tabular-nums}
.big small{font-size:18px;font-weight:600;margin-left:3px;opacity:.75}
.sub{font-size:12px;color:var(--faint)}
.trace canvas{display:block;width:100%;height:92px;margin-top:6px}
.c-cpu{color:var(--cpu)} .c-ram{color:var(--ram)} .c-disk{color:var(--disk)} .c-temp{color:var(--temp)} .c-batt{color:var(--batt)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:12px 14px;min-width:0}
.tile .big{font-size:30px;margin-top:4px}
.tile .big small{font-size:14px}
.bar{height:6px;border-radius:3px;background:#1A3442;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:currentColor;transition:width .6s}
.tile.warn,.tile.low{border-color:rgba(255,77,77,.6)}
.tile.warn .label::after{content:"　偏高";color:var(--alarm)}
.tile.low .label::after{content:"　空間不足";color:var(--alarm)}

.procs{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:12px 16px;flex:1;min-height:90px;overflow:auto}
.procs h3{font-size:13px;font-weight:500;color:var(--dim);letter-spacing:.04em;margin-bottom:6px}
.proc{display:grid;grid-template-columns:1fr auto;gap:8px;font:13px/1.9 var(--f-mono)}
.proc span:last-child{color:var(--ram)}

/* 病歷：操作紀錄 */
.log{border:1px solid var(--line);border-radius:14px;background:var(--panel);display:flex;flex-direction:column;min-height:0}
.log h2{display:flex;justify-content:space-between;align-items:baseline;padding:14px 18px 10px;border-bottom:1px solid var(--line);font-size:17px;font-weight:700}
.log h2 span:last-child{font-size:12px;font-weight:400;color:var(--faint)}
.entries{overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.entry{border-left:4px solid var(--ram);background:var(--panel2);border-radius:4px 12px 12px 4px;padding:12px 14px}
.entry.err{border-left-color:var(--alarm)}
.entry.fresh{animation:arrive 1.2s ease-out;box-shadow:0 0 0 1px rgba(60,211,242,.5),0 0 24px rgba(60,211,242,.18)}
@keyframes arrive{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.entry .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.entry .ttl{font-weight:700;font-size:16px}
.entry .when{font:13px var(--f-num);color:var(--dim)}
.entry .tag{font-size:12px;padding:1px 8px;border-radius:999px;background:rgba(60,211,242,.14);color:var(--ram)}
.entry.err .tag{background:rgba(255,77,77,.15);color:var(--alarm)}
.kv{font-size:12px;color:var(--faint);margin:10px 0 4px;letter-spacing:.06em}
pre{font:12.5px/1.6 var(--f-mono);white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto;padding:9px 11px;border-radius:8px}
pre.cmd{background:#081A24;color:#9FC3C8}
pre.out{background:#04100A;color:#C9F7DC}
details summary{cursor:pointer;color:var(--dim);font-size:12px;margin-top:8px}
summary:focus-visible{outline:2px solid var(--ram);outline-offset:2px}
.empty{color:var(--dim);padding:30px 6px;text-align:center}
.offline{display:none;padding:10px 16px;border-radius:12px;background:rgba(255,77,77,.12);border:1px solid rgba(255,77,77,.5);color:#FFC2C2;font-size:14px}
.offline.show{display:block}

@media (max-width:980px){
  .app{height:auto}
  .main{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="band">
    <div class="host" id="host">—</div>
    <div class="meta"><b id="model">讀取中</b><br><span id="os">Windows</span> · <span id="ip">—</span> · 已開機 <span id="uptime">—</span></div>
    <div class="spacer"></div>
    <div class="pill" id="pill"><span class="dot"></span><span id="pillText">讀取中</span></div>
    <div class="clock" id="clock">--:--:--</div>
  </div>

  <div class="main">
    <div class="col">
      <div class="offline" id="offline">數值停止更新了：監看程式沒有在跑。雙擊桌面的「Claude儀表板.bat」重新啟動。</div>
      <section class="trace">
        <header><span class="label">CPU 使用率</span><span class="sub">最近 5 分鐘</span></header>
        <div class="big c-cpu" id="cpu">--<small>%</small></div>
        <canvas id="cvCpu" aria-label="CPU 使用率曲線"></canvas>
      </section>
      <section class="trace">
        <header><span class="label">記憶體使用</span><span class="sub" id="ramSub">—</span></header>
        <div class="big c-ram" id="ram">--<small>%</small></div>
        <canvas id="cvRam" aria-label="記憶體使用曲線"></canvas>
      </section>
      <div class="tiles">
        <div class="tile c-disk" id="tC"><div class="label">C 槽剩餘</div><div class="big" id="dC">--</div><div class="bar"><i id="bC"></i></div></div>
        <div class="tile c-disk" id="tD"><div class="label">D 槽剩餘</div><div class="big" id="dD">--</div><div class="bar"><i id="bD"></i></div></div>
        <div class="tile c-temp" id="tT"><div class="label">溫度</div><div class="big" id="temp">--</div><div class="sub" id="tempSub"></div></div>
        <div class="tile c-batt"><div class="label">電池</div><div class="big" id="batt">--</div><div class="sub" id="battSub"></div></div>
        <div class="tile c-cpu"><div class="label">遠端操作</div><div class="big" id="count">0<small>次</small></div><div class="sub" id="lastAt">尚無紀錄</div></div>
        <div class="tile c-ram"><div class="label">執行中的程序</div><div class="big" id="pcount">--</div><div class="sub">個</div></div>
      </div>
      <section class="procs">
        <h3>記憶體用量前五名</h3>
        <div id="procs"></div>
      </section>
    </div>

    <section class="log">
      <h2><span>Claude 遠端操作紀錄</span><span>新的在最上面</span></h2>
      <div class="entries" id="entries"><div class="empty">還沒有操作紀錄。Claude 送指令過來時，會出現在這裡。</div></div>
    </section>
  </div>
</div>

<script>
var $ = function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
/* 傳送用的 base64 之類的長字串對人沒意義，顯示時縮短 */
function clip(s){return String(s==null?'':s).replace(/[A-Za-z0-9+\/=]{200,}/g,function(m){return m.slice(0,48)+'…（省略 '+m.length+' 字元）'})}
function pad(n){return n<10?'0'+n:''+n}
function hms(d){return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}

/* 讀同資料夾的 .js 資料檔：file:// 不能用 fetch，所以每次重新插入 script 標籤 */
function load(file,name,cb){
  window[name]=name==='LOG'?[]:null;
  var s=document.createElement('script');s.charset='utf-8';s.src=file+'?t='+Date.now();
  s.onload=function(){s.remove();cb(window[name])};
  s.onerror=function(){s.remove();cb(null)};
  document.head.appendChild(s);
}

/* 心電圖式掃描曲線：寫入點往右走，前方留一段空白 */
function Sweep(canvas,color){this.c=canvas;this.color=color;this.n=150;this.buf=new Array(this.n).fill(null);this.pos=0}
Sweep.prototype.push=function(v){
  this.buf[this.pos]=v;this.pos=(this.pos+1)%this.n;
  for(var k=0;k<5;k++)this.buf[(this.pos+k)%this.n]=null;
  this.draw();
};
Sweep.prototype.draw=function(){
  var c=this.c,r=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
  if(c.width!==Math.round(w*r)){c.width=Math.round(w*r);c.height=Math.round(h*r)}
  var g=c.getContext('2d');g.setTransform(r,0,0,r,0,0);g.clearRect(0,0,w,h);
  g.strokeStyle='rgba(255,255,255,.06)';g.lineWidth=1;
  for(var y=0;y<=4;y++){g.beginPath();g.moveTo(0,Math.round(y*(h-1)/4)+.5);g.lineTo(w,Math.round(y*(h-1)/4)+.5);g.stroke()}
  var dx=w/(this.n-1),Y=function(v){return h-4-(v/100)*(h-8)};
  g.strokeStyle=this.color;g.lineWidth=2.2;g.lineJoin='round';g.shadowColor=this.color;g.shadowBlur=10;
  g.beginPath();var pen=false;
  for(var i=0;i<this.n;i++){var v=this.buf[i];
    if(v==null){pen=false;continue}
    if(!pen){g.moveTo(i*dx,Y(v));pen=true}else g.lineTo(i*dx,Y(v))}
  g.stroke();
  var head=(this.pos-1+this.n)%this.n,hv=this.buf[head];
  if(hv!=null){g.fillStyle='#fff';g.shadowBlur=16;g.beginPath();g.arc(head*dx,Y(hv),3.2,0,7);g.fill()}
  g.shadowBlur=0;
};
var css=getComputedStyle(document.documentElement);
var swCpu=new Sweep($('cvCpu'),css.getPropertyValue('--cpu').trim());
var swRam=new Sweep($('cvRam'),css.getPropertyValue('--ram').trim());
window.addEventListener('resize',function(){swCpu.draw();swRam.draw()});

function setDisk(L,d){
  if(!d){$('d'+L).textContent='—';return}
  var pct=d.free/d.total;
  $('d'+L).innerHTML=d.free.toFixed(1)+'<small>GB</small>';
  $('b'+L).style.width=Math.round((1-pct)*100)+'%';
  $('t'+L).classList.toggle('low',pct<0.1);
}

var lastT=null,HOST='這台電腦';
function renderStats(S){
  var stale=!S||(Date.now()-new Date(S.t).getTime()>10000);
  $('offline').classList.toggle('show',stale);
  $('pill').className='pill '+(stale?'off':S.remote?'live':'');
  $('pillText').textContent=stale?'監看已停止':S.remote?'Claude 連線中':'待命，沒有遠端連線';
  if(!S)return;
  $('host').textContent=S.host||'—';HOST=S.host||HOST;document.title=HOST+' 監視器';if(S.os)$('os').textContent=S.os;
  if(S.model)$('model').textContent=S.model;
  $('ip').textContent=S.ip||'—';
  var u=S.uptimeH;$('uptime').textContent=u>=24?(u/24).toFixed(1)+' 天':u.toFixed(1)+' 小時';
  $('cpu').innerHTML=S.cpu+'<small>%</small>';
  var rp=Math.round(S.ramUsed/S.ramTotal*100);
  $('ram').innerHTML=rp+'<small>%</small>';
  $('ramSub').textContent=(S.ramUsed/1024).toFixed(1)+' / '+(S.ramTotal/1024).toFixed(1)+' GB';
  if(!stale&&S.t!==lastT){swCpu.push(S.cpu);swRam.push(rp);lastT=S.t}
  var disks={};(S.disks||[]).forEach(function(d){disks[d.id.charAt(0)]=d});
  setDisk('C',disks.C);setDisk('D',disks.D);
  if(S.temp!=null){$('temp').innerHTML=S.temp+'<small>°C</small>';$('tempSub').textContent='最熱的感應器';$('tT').classList.toggle('warn',S.temp>=80)}
  else{$('temp').textContent='—';$('tempSub').textContent='要用系統管理員身分執行才讀得到'}
  if(S.batt!=null){$('batt').innerHTML=Math.min(100,S.batt)+'<small>%</small>';$('battSub').textContent=S.charging?'插電中':'使用電池'}
  else{$('batt').textContent='—';$('battSub').textContent='偵測不到電池'}
  $('pcount').textContent=S.pcount;
  $('procs').innerHTML=(S.procs||[]).map(function(p){return '<div class="proc"><span>'+esc(p.n)+'</span><span>'+p.mb.toLocaleString()+' MB</span></div>'}).join('');
}

var shown=-1;
function renderLog(L){
  if(!L||L.length===shown)return;
  var first=shown<0;shown=L.length;
  $('count').innerHTML=L.length+'<small>次</small>';
  if(!L.length)return;
  $('lastAt').textContent='最近一次 '+hms(new Date(L[L.length-1].t));
  var now=Date.now();
  $('entries').innerHTML=L.slice().reverse().map(function(e,i){
    var d=new Date(e.t),title=e.title||String(e.cmd).split('\n')[0].slice(0,60);
    var fresh=!first&&i===0&&(now-d.getTime()<120000);
    return '<article class="entry'+(e.ok===false?' err':'')+(fresh?' fresh':'')+'">'+
      '<div class="top"><span class="ttl">'+esc(title)+'</span><span class="when">'+(d.getMonth()+1)+'/'+d.getDate()+' '+hms(d)+'</span>'+
      (e.ms!=null?'<span class="tag">'+(e.ok===false?'失敗 · ':'')+(e.ms/1000).toFixed(1)+' 秒</span>':'')+'</div>'+
      '<details'+(i===0?' open':'')+'><summary>Claude 送來的指令</summary><pre class="cmd">'+esc(clip(e.cmd))+'</pre></details>'+
      '<div class="kv">'+esc(HOST)+' 的回應</div><pre class="out">'+(e.out?esc(clip(e.out)):'（沒有輸出）')+'</pre></article>';
  }).join('');
  if(!first)$('entries').scrollTop=0;
}

function tick(){$('clock').textContent=hms(new Date())}
setInterval(tick,1000);tick();
function poll(){load('stats.js','STATS',function(S){renderStats(S);load('log.js','LOG',function(L){renderLog(L);setTimeout(poll,2000)})})}
poll();
</script>
</body>
</html>
