<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>敲拍對時 — __TITLE__</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;
  background:#0d1219; color:#E8EEF5; height:100vh; display:flex; flex-direction:column;
  overflow:hidden;
}
header{padding:18px 28px 12px; border-bottom:1px solid #1e2836}
h1{font-size:20px; font-weight:700; letter-spacing:.04em}
.sub{font-size:14px; color:#7b8a9c; margin-top:4px}

/* 操作說明 —— 放最上面，因為這是使用者第一次用 */
.howto{margin:14px 28px 0; background:#131b26; border:1px solid #223046; border-radius:10px;
  padding:14px 18px; font-size:15px; line-height:1.85}
.k{display:inline-block; background:#26374d; border:1px solid #3a4f6b; border-radius:6px;
   padding:1px 10px; font-weight:700; margin:0 2px}
.hi{color:#FFD54A}

/* 播放列 */
.player{display:flex; align-items:center; gap:16px; padding:14px 28px}
button{font-family:inherit; font-size:15px; cursor:pointer; border-radius:8px;
  border:1px solid #3a4f6b; background:#1b2635; color:#E8EEF5; padding:9px 16px}
button:hover{background:#243448}
button.primary{background:#FFD54A; color:#1a1400; border-color:#FFD54A; font-weight:700}
button.primary:hover{background:#ffdf70}
#time{font-variant-numeric:tabular-nums; font-size:17px; min-width:120px; color:#a8b8ca}
#bar{flex:1; height:8px; background:#1e2836; border-radius:4px; position:relative; cursor:pointer}
#fill{position:absolute; left:0; top:0; height:100%; background:#FFD54A; border-radius:4px; width:0}

/* 歌詞清單 */
#list{flex:1; overflow-y:auto; padding:8px 28px 28px}
.row{display:flex; align-items:center; gap:14px; padding:9px 12px; border-radius:8px;
  font-size:17px; cursor:pointer}
.row:hover{background:#141c27}
.row .t{font-variant-numeric:tabular-nums; color:#6f8093; min-width:96px; font-size:14px}
.row.done .t{color:#7fd48a}
.row.done .x{color:#9fb0c4}
.row.next{background:#1d2836; outline:2px solid #FFD54A}
.row.next .x{color:#FFD54A; font-weight:700; font-size:21px}
.row .gap{color:#e08a5a; font-size:13px; margin-left:8px}

footer{padding:14px 28px; border-top:1px solid #1e2836; display:flex; align-items:center; gap:14px}
#count{color:#7b8a9c; font-size:15px; flex:1}
label{font-size:14px; color:#a8b8ca; display:flex; align-items:center; gap:8px}
input[type=range]{width:170px}
#offv{font-variant-numeric:tabular-nums; min-width:58px; display:inline-block}
</style>
</head>
<body>

<header>
  <h1>敲拍對時 — __TITLE__</h1>
  <div class="sub">跟著歌一句一句敲，標完就能匯出</div>
</header>

<div class="howto">
  按 <span class="k">空白鍵</span> 開始播放。之後<span class="hi">每唱到一句新歌詞的第一個字，就敲一下空白鍵</span>。<br>
  敲錯了按 <span class="k">Backspace</span> 退回上一句　·
  遇到間奏可按 <span class="k">E</span> 標記「這句唱完了」（不標也可以）<br>
  <span class="k">←</span> <span class="k">→</span> 快退／快進 3 秒　·　點清單裡任何一句可以跳到那裡重來
</div>

<div class="player">
  <button id="play">▶ 播放</button>
  <div id="time">0:00.0 / 0:00.0</div>
  <div id="bar"><div id="fill"></div></div>
</div>

<div id="list"></div>

<footer>
  <div id="count"></div>
  <label>整體微調
    <input type="range" id="off" min="-1" max="1" step="0.05" value="0">
    <span id="offv">0.00 秒</span>
  </label>
  <button id="reset">全部重來</button>
  <button class="primary" id="save">匯出歌詞檔</button>
</footer>

<script>
const TEXTS = __TEXTS_JSON__;      // 每一句歌詞（純文字，還沒有時間）
const MP3   = "__MP3_B64__";
const NAME  = "__OUTNAME__";

/* 把 base64 文字還原成真正的音檔 */
function b64ToBytes(b){const s=atob(b),a=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
const audio = new Audio();
audio.src = URL.createObjectURL(new Blob([b64ToBytes(MP3)],{type:"audio/mpeg"}));

/* 狀態：每一句的開始時間、結束時間（結束可以不標）*/
let starts = TEXTS.map(()=>null);
let ends   = TEXTS.map(()=>null);
let ptr    = 0;                    // 下一個要敲的是第幾句

const listEl=document.getElementById('list');
const rows = TEXTS.map(function(t,i){
  const d=document.createElement('div'); d.className='row';
  d.innerHTML='<span class="t"></span><span class="x"></span><span class="gap"></span>';
  d.onclick=function(){ jumpTo(i); };
  listEl.appendChild(d); return d;
});

function fmt(s){
  if(s===null||s===undefined||!isFinite(s)) return '—';
  const m=Math.floor(s/60), r=(s%60);
  return m+':'+(r<10?'0':'')+r.toFixed(1);
}

function draw(){
  rows.forEach(function(d,i){
    d.className='row'+(starts[i]!==null?' done':'')+(i===ptr?' next':'');
    d.children[0].textContent = starts[i]===null ? '—' : fmt(starts[i]);
    d.children[1].textContent = TEXTS[i];
    d.children[2].textContent = ends[i]!==null ? '（唱完於 '+fmt(ends[i])+'）' : '';
  });
  document.getElementById('count').textContent =
    '已標 '+starts.filter(x=>x!==null).length+' / '+TEXTS.length+' 句';
  const n=rows[ptr]; if(n) n.scrollIntoView({block:'center'});
}

function tap(){                     // 敲一下 = 這一句從現在開始
  if(ptr>=TEXTS.length) return;
  starts[ptr]=audio.currentTime; ends[ptr]=null; ptr++; draw();
}
function markEnd(){                 // 標記「上一句唱完了」→ 之後就是間奏
  if(ptr>0) ends[ptr-1]=audio.currentTime;
  draw();
}
function undo(){
  if(ptr>0){ ptr--; starts[ptr]=null; ends[ptr]=null; draw(); }
}
function jumpTo(i){                 // 從第 i 句重來
  ptr=i;
  for(let k=i;k<TEXTS.length;k++){ starts[k]=null; ends[k]=null; }
  if(i>0 && starts[i-1]!==null) audio.currentTime=Math.max(0,starts[i-1]);
  draw();
}

/* ---- 播放控制 ---- */
const playBtn=document.getElementById('play');
playBtn.onclick=function(){ audio.paused?audio.play():audio.pause(); };
audio.onplay =function(){ playBtn.textContent='⏸ 暫停'; };
audio.onpause=function(){ playBtn.textContent='▶ 播放'; };

const bar=document.getElementById('bar'), fill=document.getElementById('fill');
bar.onclick=function(e){
  const r=bar.getBoundingClientRect();
  audio.currentTime=(e.clientX-r.left)/r.width*(audio.duration||0);
};
setInterval(function(){
  const d=audio.duration||0;
  document.getElementById('time').textContent=fmt(audio.currentTime)+' / '+fmt(d);
  fill.style.width=(d?audio.currentTime/d*100:0)+'%';
},80);

document.addEventListener('keydown',function(e){
  if(e.code==='Space'){
    e.preventDefault();
    if(audio.paused){ audio.play(); }    // 第一下先開始播
    else { tap(); }                      // 之後每一下都是「這句開始了」
  }
  else if(e.code==='Backspace'){ e.preventDefault(); undo(); }
  else if(e.key==='e'||e.key==='E'){ markEnd(); }
  else if(e.code==='ArrowLeft'){  audio.currentTime=Math.max(0,audio.currentTime-3); }
  else if(e.code==='ArrowRight'){ audio.currentTime=audio.currentTime+3; }
});

/* ---- 整體微調：大部分人會慢半拍，可以整批往前移 ---- */
const off=document.getElementById('off'), offv=document.getElementById('offv');
off.oninput=function(){ offv.textContent=(+off.value).toFixed(2)+' 秒'; };

document.getElementById('reset').onclick=function(){
  starts=TEXTS.map(()=>null); ends=TEXTS.map(()=>null); ptr=0; draw();
};

/* ---- 匯出 ---- */
function pad(n,w){ return String(n).padStart(w,'0'); }
function stamp(s){
  s=Math.max(0,s);
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), sec=Math.floor(s%60);
  return pad(h,2)+':'+pad(m,2)+':'+pad(sec,2)+','+pad(Math.round(s%1*1000),3);
}
// 把目前標好的時間組成歌詞檔內容。抽成獨立函式是為了「測得到」——
// 混在按鈕的處理裡就只能靠人手動點按鈕才知道對不對。
function buildExport(shift){
  const idx=[]; for(let i=0;i<TEXTS.length;i++) if(starts[i]!==null) idx.push(i);
  if(!idx.length) return null;

  // 沒特別標「唱完」的，就用下一句的開始時間當結束
  const durs=[];
  const rec=idx.map(function(i,n){
    const st=starts[i]+shift;
    let en=ends[i]!==null?ends[i]+shift
          :(n+1<idx.length?starts[idx[n+1]]+shift:null);
    if(en!==null) durs.push(en-st);
    return {st:st,en:en,text:TEXTS[i]};
  });
  durs.sort(function(a,b){return a-b;});
  const med=durs.length?durs[Math.floor(durs.length/2)]:4;
  return rec.map(function(r,n){
    const en=r.en!==null?r.en:r.st+med;
    return (n+1)+' '+stamp(r.st)+' --> '+stamp(en)+' '+r.text;
  }).join('\n\n')+'\n';
}

document.getElementById('save').onclick=function(){
  const out=buildExport(+off.value);
  if(!out){ alert('還沒有標到任何一句。'); return; }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([out],{type:'text/plain;charset=utf-8'}));
  a.download=NAME;
  a.click();
};

draw();
</script>
</body>
</html>
